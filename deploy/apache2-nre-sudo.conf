# NexEditorStats - Bridge page runs sudo from PHP (journalctl / systemctl).
# Option B: keep Apache hardening, but let sudo read its policy.
# setup.sh copies this header and then appends InaccessiblePaths= (reset +
# vendor list minus /etc/sudoers and /etc/sudoers.d).
#
# RestrictSUIDSGID=no     - setuid sudo (Apache cgroup)
# BindReadOnlyPaths       - remount policy files if InaccessiblePaths hid them
[Service]
RestrictSUIDSGID=no
BindReadOnlyPaths=/etc/sudoers /etc/sudoers.d
